<div class="mode-row">
  <label class="mode-toggle">
    <span class="mode-toggle-label" [class.mode-toggle-label-active]="!checked()">Daily Mode</span>
    <input
      type="checkbox"
      class="mode-toggle-input"
      [checked]="checked()"
      (change)="toggled.emit()"
    />
    <span class="mode-toggle-track"></span>
    <span class="mode-toggle-label" [class.mode-toggle-label-active]="checked()">Unlimited Mode</span>
  </label>
</div>
