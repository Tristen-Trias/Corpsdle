<header class="scoreboard-header">
  <button type="button" class="how-to-play-btn" (click)="howToPlay.emit()" aria-label="How to play" title="How to play">
    <i class="fa-solid fa-circle-question"></i> How to play
  </button>
  <button type="button" class="info-btn" (click)="info.emit()" aria-label="Info" title="Info">
    <i class="fa-solid fa-circle-info"></i> Info
  </button>
  <button
    type="button"
    class="theme-toggle"
    (click)="themeToggled.emit()"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    title="Toggle theme"
  >
    <i class="fa-solid" [class.fa-sun]="theme() === 'dark'" [class.fa-moon]="theme() !== 'dark'"></i>
  </button>
  <p class="eyebrow">
    @if (isUnlimited()) {
      DCI · Unlimited Mode
    } @else {
      DCI · Daily Show Guesser · #{{ gameNumber() }}
    }
  </p>
  <h1 class="wordmark">Corpsdle</h1>
  <p class="tagline">{{ tagline() }}</p>
</header>
