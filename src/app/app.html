<div class="field">
  <app-header
    [theme]="theme()"
    [isUnlimited]="game.isUnlimited()"
    [gameNumber]="game.gameNumber"
    [tagline]="tagline()"
    (howToPlay)="openHowToPlay()"
    (stats)="openStats()"
    (info)="openInfo()"
    (themeToggled)="toggleTheme()"
  />

  <app-mode-toggle [checked]="game.isUnlimited()" (toggled)="game.toggleUnlimited()" />

  <app-how-to-play-modal [open]="howToPlayOpen()" (closed)="closeHowToPlay()" />

  <app-info-modal [open]="infoOpen()" (closed)="closeInfo()" />

  <app-stats-modal [open]="statsOpen()" (closed)="closeStats()" />

  @if (game.loadState() === 'loading') {
    <p class="status-msg">Loading today's chart…</p>
  } @else if (game.loadState() === 'error') {
    <p class="status-msg error-msg">Couldn't load the show data. Refresh to try again.</p>
  } @else {

    @if (game.guesses().length > 0) {
      <app-guess-board [guesses]="game.guesses()" />
    }

    <app-result-banner
      [status]="game.status()"
      [isUnlimited]="game.isUnlimited()"
      [guessCount]="game.guesses().length"
      [answer]="game.answer()"
      [shareCopied]="shareCopied()"
      [shareText]="shareText()"
      (nextShow)="game.startUnlimitedRound()"
      (share)="shareResults()"
    />

    @if (game.status() === 'playing') {
      <app-guess-form
        [guessInput]="guessInput()"
        [suggestionsOpen]="suggestionsOpen()"
        [suggestions]="suggestions()"
        [guessError]="game.guessError()"
        [guessesRemaining]="game.guessesRemaining()"
        (inputChange)="onInputChange($event)"
        (blurred)="onBlur()"
        (submitted)="submit()"
        (suggestionPicked)="pickSuggestion($event)"
      />
    }
  }

  <footer class="footnote">
    Created by Tristen Trias
  </footer>
</div>
